name: Deploy to Render

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile -t posnovena:${{ github.sha }} .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        # --fail: sin el, un 401 por hook revocado deja el workflow en verde.
        run: |
          if [ -z "$HOOK" ]; then
            echo "Falta el secret RENDER_DEPLOY_HOOK_URL (Settings > Secrets > Actions)." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK"