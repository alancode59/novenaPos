services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      - mysql
    volumes:
      - .:/app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-posnovena}
      MYSQL_USER: ${MYSQL_USER:-posnovena}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-posnovena}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
