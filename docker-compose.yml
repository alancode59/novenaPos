services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-posnovena}
      POSTGRES_USER: ${POSTGRES_USER:-posnovena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posnovena}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posnovena} -d ${POSTGRES_DB:-posnovena}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reemplaza a phpMyAdmin: un solo binario y habla Postgres.
  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
